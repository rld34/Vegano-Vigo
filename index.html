<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vigo vegano — sitios vexetais para comer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,500;12..96,600;12..96,700;12..96,800&family=Instrument+Sans:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<style>
  :root{
    --paper:#EDEBE3; --ink:#18170F; --ink-soft:#726E62; --moss:#18170F;
    --turmeric:#8A5A34; --clay:#9C6B45; --gray:#A6A296; --line:#DBD8CE; --card:#F7F6F1; --shadow:rgba(24,23,15,0.08);
  }
  *{box-sizing:border-box;}
  html{scroll-behavior:smooth;}
  body{margin:0;background:var(--paper);color:var(--ink);font-family:'Instrument Sans',sans-serif;-webkit-font-smoothing:antialiased;}
  @media (prefers-reduced-motion:reduce){*{animation:none !important;transition:none !important;}}
  a{color:inherit;}
  button{font-family:inherit;cursor:pointer;}

  /* ---- floating controls over hero ---- */
  .fab-row{position:fixed;top:20px;right:22px;z-index:60;display:flex;align-items:center;gap:10px;}
  .fab-row.scrolled{}
  .menu-btn{width:46px;height:46px;border-radius:50%;border:1px solid var(--ink);background:var(--paper);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;}
  .menu-btn span{display:block;width:18px;height:1.5px;background:var(--ink);transition:transform .3s ease,opacity .3s ease;}
  .menu-btn.open span:nth-child(1){transform:translateY(6.5px) rotate(45deg);}
  .menu-btn.open span:nth-child(2){opacity:0;}
  .menu-btn.open span:nth-child(3){transform:translateY(-6.5px) rotate(-45deg);}

  /* ---- hero: minimal, protagonist ---- */
  .hero{min-height:100svh;min-height:100vh;display:flex;flex-direction:column;justify-content:flex-end;padding:120px 22px 72px;position:relative;}
  .hero-inner{max-width:1100px;margin:0 auto;width:100%;position:relative;}
  .hero h1{font-family:'Bricolage Grotesque',sans-serif;font-weight:600;font-size:clamp(30px,9vw,148px);line-height:.92;margin:0;letter-spacing:-0.035em;white-space:nowrap;}
  .hero h1 em{font-style:normal;font-weight:400;color:var(--ink-soft);}
  .scroll-cue{position:absolute;left:22px;bottom:28px;display:flex;align-items:center;gap:8px;font-family:'Instrument Sans',sans-serif;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-soft);}
  .scroll-cue span{width:1px;height:28px;background:var(--ink-soft);display:block;animation:scrollcue 1.8s ease-in-out infinite;}
  @keyframes scrollcue{0%,100%{opacity:.25;transform:scaleY(.6);transform-origin:top;}50%{opacity:1;transform:scaleY(1);transform-origin:top;}}
  @media (max-width:640px){
    .scroll-cue{display:none;}
    .hero h1{white-space:normal;font-size:clamp(46px,16vw,84px);line-height:.96;}
    .city-menu-item{font-size:clamp(46px,16vw,84px);white-space:normal;}
  }

  .city-switch{position:relative;display:inline-flex;align-items:baseline;gap:.02em;cursor:pointer;color:var(--ink);background-image:linear-gradient(var(--ink),var(--ink));background-repeat:no-repeat;background-position:0 92%;background-size:0% 2px;transition:background-size .35s cubic-bezier(.4,0,.2,1),color .3s ease;}
  .city-switch:hover, .city-switch.open{background-size:100% 2px;}
  .city-switch:focus-visible{outline:2px solid var(--ink);outline-offset:6px;}
  .city-chevron{width:.22em;height:.22em;vertical-align:middle;margin-left:.06em;position:relative;top:-0.06em;transition:transform .3s ease;stroke-width:2.4;}
  .city-switch.open .city-chevron{transform:rotate(180deg);}
  .city-menu{position:absolute;left:0;right:0;bottom:100%;margin-bottom:10px;display:flex;flex-direction:column;align-items:flex-start;opacity:0;visibility:hidden;transform:translateY(14px);transition:opacity .32s ease,transform .32s cubic-bezier(.4,0,.2,1),visibility .32s;z-index:5;pointer-events:none;}
  .city-switch:hover .city-menu, .city-switch.open .city-menu{opacity:1;visibility:visible;transform:translateY(0);pointer-events:auto;}
  .city-menu-item{font-family:'Bricolage Grotesque',sans-serif;font-size:clamp(30px,9vw,148px);font-weight:600;letter-spacing:-0.035em;line-height:1.05;white-space:nowrap;color:rgba(24,23,15,0.16);transition:color .2s ease;cursor:pointer;}
  .city-menu-item:hover, .city-menu-item:focus-visible{color:var(--ink);}
  .city-menu-empty{font-family:'Instrument Sans',sans-serif;font-size:14px;color:var(--ink-soft);white-space:nowrap;}

  /* ---- hamburger side panel ---- */
  .menu-overlay{position:fixed;inset:0;background:rgba(24,23,15,0.25);opacity:0;visibility:hidden;transition:opacity .3s ease,visibility .3s;z-index:55;}
  .menu-overlay.open{opacity:1;visibility:visible;}
  .menu-panel{position:fixed;top:0;right:0;bottom:0;width:min(400px,88vw);background:var(--paper);border-left:1px solid var(--line);z-index:59;padding:96px 28px 28px;overflow-y:auto;transform:translateX(100%);transition:transform .4s cubic-bezier(.4,0,.2,1);display:flex;flex-direction:column;gap:28px;}
  .menu-panel.open{transform:translateX(0);}
  .menu-section-label{font-family:'Instrument Sans',sans-serif;font-weight:500;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-soft);margin-bottom:12px;}
  .view-toggle{display:flex;border:1px solid var(--ink);border-radius:100px;overflow:hidden;}
  .view-toggle button{flex:1;padding:10px 0;font-family:'Instrument Sans',sans-serif;font-weight:500;font-size:13px;background:transparent;border:none;color:var(--ink);}
  .view-toggle button.active{background:var(--ink);color:var(--paper);}
  .menu-search{width:100%;font-family:'Instrument Sans',sans-serif;font-size:15px;padding:11px 14px;border:1px solid var(--line);border-radius:100px;background:var(--card);color:var(--ink);}
  .menu-search:focus{outline:2px solid var(--ink);outline-offset:1px;}
  .menu-chip-row{display:flex;gap:8px;flex-wrap:wrap;}
  .menu-chip{font-family:'Instrument Sans',sans-serif;font-weight:500;font-size:12px;letter-spacing:.01em;padding:7px 14px;border-radius:100px;border:1px solid var(--line);background:transparent;color:var(--ink-soft);}
  .menu-chip.active{background:var(--ink);border-color:var(--ink);color:var(--paper);}
  .menu-sort-btn{font-family:'Instrument Sans',sans-serif;font-weight:500;font-size:13px;padding:10px 14px;border-radius:100px;border:1px solid var(--line);background:transparent;color:var(--ink-soft);width:100%;text-align:left;}
  .menu-sort-btn.on{background:var(--ink);border-color:var(--ink);color:var(--paper);}
  .menu-footer-note{font-size:11.5px;color:var(--ink-soft);line-height:1.6;margin-top:auto;padding-top:20px;border-top:1px solid var(--line);}

  main{max-width:1100px;margin:0 auto;padding:8px 22px 80px;}
  .section{margin-top:64px;}
  .section-head{display:flex;align-items:baseline;gap:12px;margin-bottom:8px;}
  .section-head .tag{font-family:'Instrument Sans',sans-serif;font-weight:500;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-soft);}
  .section h2{font-family:'Bricolage Grotesque',sans-serif;font-weight:600;font-size:32px;margin:0;letter-spacing:-0.01em;}
  .section .desc{font-size:14px;color:var(--ink-soft);margin:8px 0 26px;max-width:56ch;line-height:1.55;}
  .empty-msg{font-family:'Instrument Sans',sans-serif;font-size:12px;color:var(--ink-soft);padding:8px 0;}

  .cards{display:grid;grid-template-columns:1fr;gap:14px;}
  .card{background:var(--card);border:1px solid var(--line);border-radius:6px;padding:16px 18px 18px;position:relative;transition:.2s ease;overflow:hidden;}
  .card:hover{box-shadow:0 8px 24px var(--shadow);transform:translateY(-1px);}
  .card::before{content:"";position:absolute;left:0;top:0;bottom:0;width:2px;background:var(--status-color,var(--line));}
  .card .photo{width:100%;height:210px;object-fit:cover;border-radius:3px;margin-bottom:14px;display:block;background:var(--line);}
  .card-top{display:grid;grid-template-columns:1fr auto;gap:6px 12px;align-items:start;}
  .card .name{font-family:'Bricolage Grotesque',sans-serif;font-weight:600;font-size:19px;line-height:1.25;letter-spacing:-0.01em;}
  .card .name .loc{display:block;font-family:'Instrument Sans',sans-serif;font-size:11.5px;color:var(--ink-soft);margin-top:3px;font-style:normal;font-weight:400;}
  .card .badges{display:flex;flex-direction:column;gap:4px;align-items:flex-end;}
  .card .status{font-family:'Instrument Sans',sans-serif;font-weight:500;font-size:10px;letter-spacing:.03em;text-transform:uppercase;padding:3px 8px;border-radius:3px;white-space:nowrap;height:fit-content;color:var(--status-color);border:1px solid var(--status-color);background:none;}
  .card .score{font-family:'Bricolage Grotesque',sans-serif;font-size:12.5px;font-weight:600;padding:2px 9px;border-radius:3px;white-space:nowrap;background:var(--ink);color:var(--paper);}
  .card .cuisine{display:inline-block;margin-top:8px;font-family:'Instrument Sans',sans-serif;font-size:10.5px;letter-spacing:.03em;text-transform:uppercase;color:var(--ink-soft);}
  .card .note{font-size:13.5px;color:var(--ink-soft);line-height:1.55;margin-top:10px;}
  .card .links{display:flex;gap:16px;margin-top:12px;flex-wrap:wrap;}
  .card .links a{font-family:'Instrument Sans',sans-serif;font-size:12px;font-weight:500;color:var(--ink);text-decoration:underline;text-decoration-color:var(--line);text-underline-offset:3px;}
  .card .links a:hover{text-decoration-color:var(--ink);}
  .card .links a.search{color:var(--ink-soft);}

  .card[data-vegan="vegano_100"]{--status-color:var(--ink);}
  .card[data-vegan="vexetariano"]{--status-color:var(--turmeric);}
  .card[data-vegan="opciones"]{--status-color:var(--clay);}
  .card[data-vegan="sen_confirmar"]{--status-color:var(--gray);}
  .card.hide{display:none;}

  /* ---- map view ---- */
  #mapView{display:none;}
  #mapView.active{display:block;}
  #placesMap{width:100%;height:calc(100vh - 40px);min-height:480px;border-radius:8px;border:1px solid var(--line);background:var(--card);}
  .leaflet-popup-content-wrapper{border-radius:8px;font-family:'Instrument Sans',sans-serif;}
  .map-popup{min-width:180px;}
  .map-popup .mp-name{font-family:'Bricolage Grotesque',sans-serif;font-weight:600;font-size:15px;margin-bottom:2px;}
  .map-popup .mp-meta{font-size:11px;color:var(--ink-soft);margin-bottom:6px;}
  .map-popup a{font-size:12px;font-weight:500;color:var(--ink);text-decoration:underline;}
  #listView.hidden, #mapView:not(.active){display:none;}

  footer{max-width:1100px;margin:0 auto;padding:40px 22px 60px;border-top:1px solid var(--line);}
  footer p{font-family:'Instrument Sans',sans-serif;font-size:11.5px;letter-spacing:.01em;color:var(--ink-soft);line-height:1.7;max-width:58ch;}

  .divider{display:flex;align-items:center;gap:10px;margin:56px 0 0;opacity:.55;}
  .divider .rule{flex:1;height:1px;background:var(--line);}

  @media (min-width:640px){.cards{grid-template-columns:1fr 1fr;}}
  @media (min-width:980px){.cards{grid-template-columns:1fr 1fr 1fr;}}

  @media (max-width:640px){
    .fab-row{top:16px;right:16px;}
    .menu-btn{width:42px;height:42px;}
    .hero{padding:96px 16px 56px;}
    main{padding:8px 16px 64px;}
    .section{margin-top:48px;}
    .section h2{font-size:26px;}
    .card{padding:14px 15px 16px;}
    .card .photo{height:180px;}
    .menu-panel{width:100vw;padding:88px 20px 24px;}
    #placesMap{height:calc(100vh - 160px);}
  }
</style>
</head>
<body>

<div class="fab-row">
  <button class="menu-btn" id="menuBtn" aria-label="Menú" aria-expanded="false"><span></span><span></span><span></span></button>
</div>

<div class="menu-overlay" id="menuOverlay"></div>
<div class="menu-panel" id="menuPanel">
  <div>
    <div class="menu-section-label">Vista</div>
    <div class="view-toggle" id="viewToggle">
      <button data-view="list" class="active">Lista</button>
      <button data-view="map">Mapa</button>
    </div>
  </div>
  <div>
    <div class="menu-section-label">Buscar</div>
    <input type="text" class="menu-search" id="searchInput" placeholder="Nome, zona ou tipo de comida...">
  </div>
  <div>
    <div class="menu-section-label">Vegano?</div>
    <div class="menu-chip-row" id="veganLegend">
      <button class="menu-chip active" data-vfilter="all">Todo</button>
      <button class="menu-chip" data-vfilter="vegano_100">100% vegano</button>
      <button class="menu-chip" data-vfilter="vexetariano">Vexetariano</button>
      <button class="menu-chip" data-vfilter="opciones">Opcións veganas</button>
      <button class="menu-chip" data-vfilter="sen_confirmar">Sen confirmar</button>
    </div>
  </div>
  <div>
    <div class="menu-section-label">Probado</div>
    <div class="menu-chip-row" id="triedLegend">
      <button class="menu-chip active" data-tfilter="all">Todo</button>
      <button class="menu-chip" data-tfilter="tried">✓ Probado</button>
      <button class="menu-chip" data-tfilter="untried">○ Por probar</button>
    </div>
  </div>
  <div>
    <div class="menu-section-label">Orde</div>
    <button class="menu-sort-btn" id="sortBtn">Ordenar por nota ↓</button>
  </div>
  <div class="menu-footer-note">Guía persoal de Nerea e Ricardo. As notas non son públicas, non hai comentarios abertos.</div>
</div>

<div class="hero">
  <div class="hero-inner">
    <h1><em>Vegano</em> en <span class="city-switch" id="cityTrigger" tabindex="0" role="button" aria-haspopup="listbox" aria-expanded="false"><span id="cityName">Vigo</span><svg class="city-chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 9l6 6 6-6"/></svg><div class="city-menu" id="cityMenu" role="listbox"></div></span></h1>
  </div>
  <div class="scroll-cue"><span></span>Scroll</div>
</div>

<main id="main">
  <div id="listView">
    <div style="font-family:'Instrument Sans',sans-serif;font-size:13px;color:var(--ink-soft);padding:40px 0;text-align:center;" id="loadingMsg">Cargando...</div>
  </div>
  <div id="mapView">
    <div id="placesMap"></div>
  </div>
</main>

<footer>
  <p>Catálogo persoal de sitios vexetais, con nota sobre 10 posta por Nerea e Ricardo.</p>
</footer>

<script>
const SUPABASE_URL = 'https://aybliczcuutagmvomdjq.supabase.co';
const SUPABASE_KEY = 'sb_publishable_43QmCEZ878iivpQ57OSLbA_-4hEezar';
const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

const VEGAN_LABEL = {vegano_100:"100% vegano", vexetariano:"Vexetariano", opciones:"Opcións veganas", sen_confirmar:"Sen confirmar"};
const PLACE_TYPES = [
  {key:"restaurante", tag:"Para comer", title:"Restaurantes", desc:"Carta con opción vexetal, dende 100% vegana até \"pregunta e adaptan\"."},
  {key:"brunch", tag:"Mañá", title:"Brunch e almorzo"},
  {key:"panadaria", tag:"Fariña", title:"Panadarías e cafés"},
  {key:"heladeria", tag:"Frío", title:"Xeados"},
  {key:"furancho", tag:"Vendima", title:"Furanchos", desc:"O vexetal depende da tapa da casa, o viño sempre é seguro."}
];

let placesData = [];
let citiesData = [];
let currentCity = localStorage.getItem('vv-city') || 'vigo';
let vFilter = 'all';
let tFilter = 'all';
let searchTerm = '';
let sortByScore = false;
let currentView = 'list';
let leafletMap = null;
let markerLayer = null;

const igSearch = name => `https://www.google.com/search?q=${encodeURIComponent(name + ' Vigo instagram')}`;
const escapeHTML = s => { const d=document.createElement('div'); d.textContent = s||''; return d.innerHTML; };

async function loadData(){
  const { data: places, error } = await sb.from('places').select('*').eq('city', currentCity).order('place_type').order('sort_order');
  if(error){ document.getElementById('loadingMsg').textContent = 'Erro cargando datos: ' + error.message; return; }
  placesData = places;
  render();
}

function cardHTML(place){
  const ig = place.instagram_url
    ? `<a href="${place.instagram_url}" target="_blank" rel="noopener">📷 Instagram</a>`
    : `<a class="search" href="${igSearch(place.name)}" target="_blank" rel="noopener">🔍 Buscar en Instagram</a>`;
  const maps = place.maps_url ? `<a href="${place.maps_url}" target="_blank" rel="noopener">📍 Maps</a>` : '';
  const web = place.website_url ? `<a href="${place.website_url}" target="_blank" rel="noopener">🌐 Web</a>` : '';
  const scoreBadge = (place.score !== null && place.score !== undefined) ? `<div class="score">${Number(place.score)}/10</div>` : '';
  const cuisine = place.cuisine_tag ? `<span class="cuisine">${escapeHTML(place.cuisine_tag)}</span>` : '';
  const photo = place.photo_url ? `<img class="photo" src="${place.photo_url}" alt="${escapeHTML(place.name)}" loading="lazy" onerror="this.remove()">` : '';
  return `
  <div class="card" data-vegan="${place.vegan_status}" data-tried="${place.score !== null ? 'tried' : 'untried'}" data-id="${place.id}">
    ${photo}
    <div class="card-top">
      <div class="name">${escapeHTML(place.name)}${place.location ? `<span class="loc">${escapeHTML(place.location)}</span>` : ''}</div>
      <div class="badges"><div class="status">${VEGAN_LABEL[place.vegan_status]}</div>${scoreBadge}</div>
    </div>
    ${cuisine}
    <div class="note">${escapeHTML(place.note||'')}</div>
    <div class="links">${maps}${web}${ig}</div>
  </div>`;
}

function getFiltered(items){
  return items.filter(p => {
    if(vFilter !== 'all' && p.vegan_status !== vFilter) return false;
    if(tFilter === 'tried' && p.score === null) return false;
    if(tFilter === 'untried' && p.score !== null) return false;
    if(searchTerm){
      const hay = `${p.name} ${p.location||''} ${p.note||''} ${p.cuisine_tag||''}`.toLowerCase();
      if(!hay.includes(searchTerm)) return false;
    }
    return true;
  });
}
function getFilteredSorted(items){
  let out = getFiltered(items);
  if(sortByScore) out = out.slice().sort((a,b) => (b.score ?? -1) - (a.score ?? -1));
  return out;
}

function renderList(){
  const main = document.getElementById('listView');
  main.innerHTML = '';
  let any = false;
  PLACE_TYPES.forEach((sec, i) => {
    const all = placesData.filter(p => p.place_type === sec.key);
    const items = getFilteredSorted(all);
    if(!all.length) return;
    any = true;
    if(i>0){
      main.innerHTML += `<div class="divider"><div class="rule"></div></div>`;
    }
    main.innerHTML += `
      <section class="section">
        <div class="section-head"><span class="tag">${sec.tag}</span></div>
        <h2>${sec.title}</h2>
        ${sec.desc ? `<p class="desc">${sec.desc}</p>` : ''}
        ${(!items.length) ? `<div class="empty-msg">Ningún resultado con estes filtros.</div>` : ''}
        <div class="cards">${items.map(cardHTML).join('')}</div>
      </section>`;
  });
  if(!any){
    const city = citiesData.find(c => c.id === currentCity);
    main.innerHTML = `<div class="empty-msg" style="text-align:center;padding:40px 0;font-size:13px;">Aínda non hai fichas para ${escapeHTML(city ? city.name : '')}. Volve pronto 🌱</div>`;
  }
}

function ensureMap(){
  if(leafletMap) return;
  leafletMap = L.map('placesMap', { scrollWheelZoom: true });
  L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png', {
    attribution: '© <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> © <a href="https://carto.com/attributions">CARTO</a>',
    maxZoom: 19
  }).addTo(leafletMap);
  markerLayer = L.layerGroup().addTo(leafletMap);
}

function renderMap(){
  ensureMap();
  markerLayer.clearLayers();
  const all = getFilteredSorted(placesData).filter(p => p.lat && p.lng);
  const bounds = [];
  all.forEach(p => {
    const marker = L.circleMarker([p.lat, p.lng], {
      radius: 7, color: '#18170F', weight: 1.5, fillColor: '#F7F6F1', fillOpacity: 1
    });
    const scoreTxt = (p.score !== null && p.score !== undefined) ? `${Number(p.score)}/10` : 'sen probar';
    marker.bindPopup(`<div class="map-popup"><div class="mp-name">${escapeHTML(p.name)}</div><div class="mp-meta">${VEGAN_LABEL[p.vegan_status]} · ${scoreTxt}</div>${p.maps_url ? `<a href="${p.maps_url}" target="_blank" rel="noopener">Ver en Maps →</a>` : ''}</div>`);
    marker.addTo(markerLayer);
    bounds.push([p.lat, p.lng]);
  });
  const city = citiesData.find(c => c.id === currentCity);
  if(bounds.length){
    leafletMap.fitBounds(bounds, { padding: [40,40], maxZoom: 16 });
  } else if(city && city.center_lat){
    leafletMap.setView([city.center_lat, city.center_lng], city.default_zoom || 13);
  } else {
    leafletMap.setView([42.2328, -8.7226], 13);
  }
  setTimeout(() => leafletMap.invalidateSize(), 200);
}

function render(){
  if(currentView === 'list'){ renderList(); }
  else { renderMap(); }
}

function setView(view){
  currentView = view;
  document.getElementById('listView').classList.toggle('hidden', view !== 'list');
  document.getElementById('mapView').classList.toggle('active', view === 'map');
  document.querySelectorAll('#viewToggle button').forEach(b => b.classList.toggle('active', b.dataset.view === view));
  render();
}
document.getElementById('viewToggle').addEventListener('click', e => {
  const btn = e.target.closest('button'); if(!btn) return;
  setView(btn.dataset.view);
});

/* ---- hamburger menu ---- */
const menuBtn = document.getElementById('menuBtn');
const menuPanel = document.getElementById('menuPanel');
const menuOverlay = document.getElementById('menuOverlay');
function toggleMenu(open){
  const isOpen = open ?? !menuPanel.classList.contains('open');
  menuPanel.classList.toggle('open', isOpen);
  menuOverlay.classList.toggle('open', isOpen);
  menuBtn.classList.toggle('open', isOpen);
  menuBtn.setAttribute('aria-expanded', String(isOpen));
}
menuBtn.addEventListener('click', () => toggleMenu());
menuOverlay.addEventListener('click', () => toggleMenu(false));

document.getElementById('veganLegend').addEventListener('click', e => {
  const chip = e.target.closest('.menu-chip'); if(!chip) return;
  document.querySelectorAll('#veganLegend .menu-chip').forEach(c => c.classList.remove('active'));
  chip.classList.add('active');
  vFilter = chip.dataset.vfilter;
  render();
});
document.getElementById('triedLegend').addEventListener('click', e => {
  const chip = e.target.closest('.menu-chip'); if(!chip) return;
  document.querySelectorAll('#triedLegend .menu-chip').forEach(c => c.classList.remove('active'));
  chip.classList.add('active');
  tFilter = chip.dataset.tfilter;
  render();
});
document.getElementById('searchInput').addEventListener('input', e => {
  searchTerm = e.target.value.trim().toLowerCase();
  render();
});
document.getElementById('sortBtn').addEventListener('click', () => {
  sortByScore = !sortByScore;
  document.getElementById('sortBtn').classList.toggle('on', sortByScore);
  render();
});

/* ---- city switcher ---- */
async function loadCities(){
  const { data, error } = await sb.from('cities').select('*').order('sort_order');
  if(error || !data || !data.length){ citiesData = [{id:'vigo', name:'Vigo'}]; }
  else { citiesData = data; }
  if(!citiesData.find(c => c.id === currentCity)) currentCity = citiesData[0].id;
  renderCityMenu();
  updateCityCopy();
}
function updateCityCopy(){
  const city = citiesData.find(c => c.id === currentCity);
  const name = city ? city.name : 'Vigo';
  document.getElementById('cityName').textContent = name;
  document.title = `${name} vegano — sitios vexetais para comer`;
  fitHeroTitle();
}
function fitHeroTitle(){
  const h1 = document.querySelector('.hero h1');
  const container = document.querySelector('.hero-inner');
  if(!h1 || !container) return;
  h1.style.fontSize = '';
  if(window.innerWidth <= 640) return; // mobile: let it wrap and stay large, no shrink-to-one-line
  requestAnimationFrame(() => {
    const maxWidth = container.clientWidth;
    let size = parseFloat(getComputedStyle(h1).fontSize);
    let guard = 0;
    while(h1.scrollWidth > maxWidth && size > 18 && guard < 60){
      size -= 2; h1.style.fontSize = size + 'px'; guard++;
    }
    document.querySelectorAll('.city-menu-item').forEach(item => {
      item.style.fontSize = size + 'px';
      let itemSize = size, g2 = 0;
      while(item.scrollWidth > maxWidth && itemSize > 18 && g2 < 60){
        itemSize -= 2; item.style.fontSize = itemSize + 'px'; g2++;
      }
    });
  });
}
window.addEventListener('resize', () => { clearTimeout(window._fitT); window._fitT = setTimeout(fitHeroTitle, 120); });

function renderCityMenu(){
  const menu = document.getElementById('cityMenu');
  const others = citiesData.filter(c => c.id !== currentCity);
  menu.innerHTML = others.length
    ? others.map(c => `<div class="city-menu-item" role="option" tabindex="0" data-city="${c.id}">${escapeHTML(c.name)}</div>`).join('')
    : `<div class="city-menu-empty">Só ${escapeHTML((citiesData.find(c=>c.id===currentCity)||{}).name || '')} por agora</div>`;
}
async function setCity(cityId){
  if(cityId === currentCity) return;
  currentCity = cityId;
  localStorage.setItem('vv-city', currentCity);
  renderCityMenu();
  updateCityCopy();
  await loadData();
}
const cityTrigger = document.getElementById('cityTrigger');
const cityMenu = document.getElementById('cityMenu');
cityMenu.addEventListener('click', (e) => {
  const item = e.target.closest('.city-menu-item'); if(!item) return;
  setCity(item.dataset.city);
  cityTrigger.classList.remove('open');
  cityTrigger.setAttribute('aria-expanded', 'false');
});
cityTrigger.addEventListener('click', (e) => {
  e.stopPropagation();
  const open = cityTrigger.classList.toggle('open');
  cityTrigger.setAttribute('aria-expanded', String(open));
});
cityTrigger.addEventListener('keydown', (e) => {
  if(e.key === 'Enter' || e.key === ' '){ e.preventDefault(); cityTrigger.click(); }
  if(e.key === 'Escape'){ cityTrigger.classList.remove('open'); cityTrigger.setAttribute('aria-expanded','false'); }
});
document.addEventListener('click', (e) => {
  if(!cityTrigger.contains(e.target)){ cityTrigger.classList.remove('open'); cityTrigger.setAttribute('aria-expanded','false'); }
});

(async () => { await loadCities(); await loadData(); })();
</script>
